<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="76" viewBox="0 0 1200 76" role="img" aria-labelledby="t"><title id="t">Proyectos destacados</title><defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="372.0" y1="0" x2="1062" y2="0"><stop offset="0" stop-color="#e8b04b"/><stop offset="1" stop-color="#5eead4" stop-opacity=".15"/></linearGradient></defs>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
.rise{animation:rise .7s ease backwards}
.cur{animation:blink 1.1s steps(1) infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
.glow{animation:glow 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.ln{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.6s ease .2s forwards}
</style>
<rect x=".5" y=".5" width="1199" height="75" rx="12" fill="#0a0e16" stroke="#ffffff" stroke-opacity=".08"/>
<rect x="0" y="18" width="4" height="40" rx="2" fill="#e8b04b"/>
<text x="24" y="46" class="mono rise" font-size="15" fill="#e8b04b">04</text>
<text x="60" y="47" class="sans rise" style="animation-delay:.1s" font-size="26" font-weight="700" fill="#e8edf4">Proyectos destacados</text>
<text x="1176" y="46" class="mono rise" style="animation-delay:.4s" font-size="13" fill="#8b97a8" text-anchor="end">código real</text>
<line x1="372.0" y1="40" x2="1062" y2="40" stroke="url(#g)" stroke-width="1.5" class="ln"/>
<circle r="3" fill="#5eead4"><animateMotion dur="4s" repeatCount="indefinite" path="M372.0 40 H1062"/></circle>
</svg>