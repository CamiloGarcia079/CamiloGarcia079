<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="t d"><title id="t">Habilidades blandas</title><desc id="d">Liderazgo y coordinación: Organizo al equipo para que cada parte encaje y se entregue a tiempo.. Comunicación clara: Explico lo técnico en palabras simples, sin importar quién escuche.. Trabajo en equipo: Me adapto a cómo trabaja el equipo y cuido los acuerdos.. Aprendizaje rápido: Aprendo herramientas nuevas por mi cuenta y las aplico pronto.. Resolución de problemas: Cuando algo falla, busco la causa real y dejo escrita la solución.. Responsabilidad y calidad: Compruebo que lo que entrego funciona antes de darlo por listo.</desc><style>.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}.gl{animation:glow 3s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g transform="translate(0 0)"><rect x=".5" y=".5" width="387" height="195" rx="14" fill="#0a0e16" stroke="#ffffff" stroke-opacity=".09"/><rect x="14" y="0" width="360" height="3" rx="1.5" fill="#e8b04b" class="gl" style="animation-delay:0.0s"/><rect x="22" y="22" width="40" height="40" rx="10" fill="#e8b04b" fill-opacity=".13"/><g transform="translate(32 32) scale(.84)"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9L12 3z" fill="none" stroke="#e8b04b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="76" y="48" class="sans" font-size="18" font-weight="700" fill="#e8edf4">Liderazgo y coordinación</text><text x="22" y="92" class="sans" font-size="14.5" fill="#e8edf4" fill-opacity=".8">Organizo al equipo para que cada parte</text><text x="22" y="113" class="sans" font-size="14.5" fill="#e8edf4" fill-opacity=".8">encaje y se entregue a tiempo.</text><line x1="22" y1="142" x2="366" y2="142" stroke="#ffffff" stroke-opacity=".12" stroke-dasharray="4 4"/><text x="22" y="164" class="mono" font-size="10.5" fill="#5eead4" letter-spacing="1">EJEMPLO REAL</text><text x="22" y="182" class="sans" font-size="13" fill="#8b97a8">Coordiné la integración en el hackathon GUARDIAN.</text></g><g transform="translate(406 0)"><rect x=".5" y=".5" width="387" height="195" rx="14" fill="#0a0e16" stroke="#ffffff" stroke-opacity=".09"/><rect x="14" y="0" width="360" height="3" rx="1.5" fill="#5eead4" class="gl" style="animation-delay:0.5s"/><rect x="22" y="22" width="40" height="40" rx="10" fill="#5eead4" fill-opacity=".13"/><g transform="translate(32 32) scale(.84)"><path d="M4 5h16v10H8l-4 4V5zM8 9h8M8 12h5" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="76" y="48" class="sans" font-size="18" font-weight="700" fill="#e8edf4">Comunicación clara</text><text x="22" y="92" class="sans" font-size="14.5" fill="#e8edf4" fill-opacity=".8">Explico lo técnico en palabras simples, sin</text><text x="22" y="113" class="sans" font-size="14.5" fill="#e8edf4" fill-opacity=".8">importar quién escuche.</text><line x1="22" y1="142" x2="366" y2="142" stroke="#ffffff" stroke-opacity=".12" stroke-dasharray="4 4"/><text x="22" y="164" class="mono" font-size="10.5" fill="#5eead4" letter-spacing="1">EJEMPLO REAL</text><text x="22" y="182" class="sans" font-size="13" fill="#8b97a8">Cada proyecto trae una guía fácil de seguir.</text></g><g transform="translate(812 0)"><rect x=".5" y=".5" width="387" height="195" rx="14" fill="#0a0e16" stroke="#ffffff" stroke-opacity=".09"/><rect x="14" y="0" width="360" height="3" rx="1.5" fill="#e8b04b" class="gl" style="animation-delay:1.0s"/><rect x="22" y="22" width="40" height="40" rx="10" fill="#e8b04b" fill-opacity=".13"/><g transform="translate(32 32) scale(.84)"><path d="M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm8 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM2 20c0-3 2.7-5 6-5s6 2 6 5M12 20c0-3 2.2-5 5-5 2.6 0 5 1.8 5 5" fill="none" stroke="#e8b04b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="76" y="48" class="sans" font-size="18" font-weight="700" fill="#e8edf4">Trabajo en equipo</text><text x="22" y="92" class="sans" font-size="14.5" fill="#e8edf4" fill-opacity=".8">Me adapto a cómo trabaja el equipo y cuido</text><text x="22" y="113" class="sans" font-size="14.5" fill="#e8edf4" fill-opacity=".8">los acuerdos.</text><line x1="22" y1="142" x2="366" y2="142" stroke="#ffffff" stroke-opacity=".12" stroke-dasharray="4 4"/><text x="22" y="164" class="mono" font-size="10.5" fill="#5eead4" letter-spacing="1">EJEMPLO REAL</text><text x="22" y="182" class="sans" font-size="13" fill="#8b97a8">La mayoría de mis proyectos son en pareja o en equipo.</text></g><g transform="translate(0 214)"><rect x=".5" y=".5" width="387" height="195" rx="14" fill="#0a0e16" stroke="#ffffff" stroke-opacity=".09"/><rect x="14" y="0" width="360" height="3" rx="1.5" fill="#5eead4" class="gl" style="animation-delay:1.5s"/><rect x="22" y="22" width="40" height="40" rx="10" fill="#5eead4" fill-opacity=".13"/><g transform="translate(32 32) scale(.84)"><path d="M12 4v16M4 12h16M7 7l10 10M17 7 7 17" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="76" y="48" class="sans" font-size="18" font-weight="700" fill="#e8edf4">Aprendizaje rápido</text><text x="22" y="92" class="sans" font-size="14.5" fill="#e8edf4" fill-opacity=".8">Aprendo herramientas nuevas por mi cuenta y</text><text x="22" y="113" class="sans" font-size="14.5" fill="#e8edf4" fill-opacity=".8">las aplico pronto.</text><line x1="22" y1="142" x2="366" y2="142" stroke="#ffffff" stroke-opacity=".12" stroke-dasharray="4 4"/><text x="22" y="164" class="mono" font-size="10.5" fill="#5eead4" letter-spacing="1">EJEMPLO REAL</text><text x="22" y="182" class="sans" font-size="13" fill="#8b97a8">En un año pasé de páginas web a sistemas seguros e IA.</text></g><g transform="translate(406 214)"><rect x=".5" y=".5" width="387" height="195" rx="14" fill="#0a0e16" stroke="#ffffff" stroke-opacity=".09"/><rect x="14" y="0" width="360" height="3" rx="1.5" fill="#e8b04b" class="gl" style="animation-delay:2.0s"/><rect x="22" y="22" width="40" height="40" rx="10" fill="#e8b04b" fill-opacity=".13"/><g transform="translate(32 32) scale(.84)"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zm9 16-4-4" fill="none" stroke="#e8b04b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="76" y="48" class="sans" font-size="18" font-weight="700" fill="#e8edf4">Resolución de problemas</text><text x="22" y="92" class="sans" font-size="14.5" fill="#e8edf4" fill-opacity=".8">Cuando algo falla, busco la causa real y</text><text x="22" y="113" class="sans" font-size="14.5" fill="#e8edf4" fill-opacity=".8">dejo escrita la solución.</text><line x1="22" y1="142" x2="366" y2="142" stroke="#ffffff" stroke-opacity=".12" stroke-dasharray="4 4"/><text x="22" y="164" class="mono" font-size="10.5" fill="#5eead4" letter-spacing="1">EJEMPLO REAL</text><text x="22" y="182" class="sans" font-size="13" fill="#8b97a8">Resolví por qué DeliveryBot no guardaba los pedidos.</text></g><g transform="translate(812 214)"><rect x=".5" y=".5" width="387" height="195" rx="14" fill="#0a0e16" stroke="#ffffff" stroke-opacity=".09"/><rect x="14" y="0" width="360" height="3" rx="1.5" fill="#5eead4" class="gl" style="animation-delay:2.5s"/><rect x="22" y="22" width="40" height="40" rx="10" fill="#5eead4" fill-opacity=".13"/><g transform="translate(32 32) scale(.84)"><path d="M5 12l4 4L19 6" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="76" y="48" class="sans" font-size="18" font-weight="700" fill="#e8edf4">Responsabilidad y calidad</text><text x="22" y="92" class="sans" font-size="14.5" fill="#e8edf4" fill-opacity=".8">Compruebo que lo que entrego funciona antes</text><text x="22" y="113" class="sans" font-size="14.5" fill="#e8edf4" fill-opacity=".8">de darlo por listo.</text><line x1="22" y1="142" x2="366" y2="142" stroke="#ffffff" stroke-opacity=".12" stroke-dasharray="4 4"/><text x="22" y="164" class="mono" font-size="10.5" fill="#5eead4" letter-spacing="1">EJEMPLO REAL</text><text x="22" y="182" class="sans" font-size="13" fill="#8b97a8">Más de 850 pruebas automáticas en mis proyectos.</text></g></svg>