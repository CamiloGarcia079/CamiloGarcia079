<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="t d"><title id="t">Cómo abordo una automatización</title><desc id="d">Cuatro pasos: entender el proceso, definir el disparador, programar la lógica e integrar y registrar.</desc><defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="80" y1="0" x2="1120" y2="0"><stop offset="0" stop-color="#e8b04b"/><stop offset="1" stop-color="#5eead4"/></linearGradient></defs>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
.rise{animation:rise .7s ease backwards}
.cur{animation:blink 1.1s steps(1) infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
.glow{animation:glow 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.ln{stroke-dasharray:1100;stroke-dashoffset:1100;animation:draw 2.4s ease .3s forwards}
</style>
<rect x=".5" y=".5" width="1199" height="199" rx="14" fill="#0a0e16" stroke="#ffffff" stroke-opacity=".08"/>
<line x1="80" y1="70" x2="1120" y2="70" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>
<line x1="80" y1="70" x2="1120" y2="70" stroke="url(#g)" stroke-width="2" class="ln"/>
<circle r="5" fill="#5eead4"><animateMotion dur="5s" repeatCount="indefinite" path="M80 70 H1120"/></circle>
<g class="rise" style="animation-delay:0.30s">
<circle cx="150" cy="70" r="22" fill="#141c2b" stroke="#e8b04b" stroke-width="2"/>
<text x="150" y="75" class="mono" font-size="13" fill="#e8b04b" text-anchor="middle" font-weight="700">01</text>
<text x="150" y="128" class="sans" font-size="17" font-weight="700" fill="#e8edf4" text-anchor="middle">Entender el proceso</text>
<text x="150" y="152" class="mono" font-size="12.5" fill="#8b97a8" text-anchor="middle">qué se hace a mano hoy</text>
</g><g class="rise" style="animation-delay:0.65s">
<circle cx="450" cy="70" r="22" fill="#141c2b" stroke="#5eead4" stroke-width="2"/>
<text x="450" y="75" class="mono" font-size="13" fill="#5eead4" text-anchor="middle" font-weight="700">02</text>
<text x="450" y="128" class="sans" font-size="17" font-weight="700" fill="#e8edf4" text-anchor="middle">Definir el disparador</text>
<text x="450" y="152" class="mono" font-size="12.5" fill="#8b97a8" text-anchor="middle">mensaje, formulario o evento</text>
</g><g class="rise" style="animation-delay:1.00s">
<circle cx="750" cy="70" r="22" fill="#141c2b" stroke="#e8b04b" stroke-width="2"/>
<text x="750" y="75" class="mono" font-size="13" fill="#e8b04b" text-anchor="middle" font-weight="700">03</text>
<text x="750" y="128" class="sans" font-size="17" font-weight="700" fill="#e8edf4" text-anchor="middle">Programar la lógica</text>
<text x="750" y="152" class="mono" font-size="12.5" fill="#8b97a8" text-anchor="middle">código simple y probado</text>
</g><g class="rise" style="animation-delay:1.35s">
<circle cx="1050" cy="70" r="22" fill="#141c2b" stroke="#5eead4" stroke-width="2"/>
<text x="1050" y="75" class="mono" font-size="13" fill="#5eead4" text-anchor="middle" font-weight="700">04</text>
<text x="1050" y="128" class="sans" font-size="17" font-weight="700" fill="#e8edf4" text-anchor="middle">Integrar y registrar</text>
<text x="1050" y="152" class="mono" font-size="12.5" fill="#8b97a8" text-anchor="middle">APIs, base de datos, avisos</text>
</g></svg>