<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-labelledby="t"><title id="t">Renta de Herramientas: Alquiler de maquinaria: reservas por fechas, pagos con IVA, devoluciones con mora y reporte de daños.</title><defs>
<linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e8b04b"/><stop offset="1" stop-color="#e8b04b" stop-opacity=".1"/></linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="gl" cx="1" cy="0" r=".8"><stop offset="0" stop-color="#e8b04b" stop-opacity=".16"/><stop offset="1" stop-color="#e8b04b" stop-opacity="0"/></radialGradient>
