<text x="26" y="106" class="sans" font-size="15" fill="#e8edf4" fill-opacity=".78">Alquiler de maquinaria: reservas por fechas, pagos con IVA,</text><text x="26" y="128" class="sans" font-size="15" fill="#e8edf4" fill-opacity=".78">devoluciones con mora y reporte de daños.</text><text x="26" y="178" class="mono" font-size="12.5" fill="#5eead4">113 pruebas · 3 roles · Docker Compose</text><g><rect x="26" y="198" width="70" height="28" rx="7" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".10"/><text x="61" y="217" class="mono" font-size="12" fill="#e8edf4" fill-opacity=".85" text-anchor="middle">Java 21</text></g><g><rect x="103.80000000000001" y="198" width="99" height="28" rx="7" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".10"/><text x="154" y="217" class="mono" font-size="12" fill="#e8edf4" fill-opacity=".85" text-anchor="middle">Spring Boot</text></g><g><rect x="211.20000000000002" y="198" width="55" height="28" rx="7" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".10"/><text x="239" y="217" class="mono" font-size="12" fill="#e8edf4" fill-opacity=".85" text-anchor="middle">MySQL</text></g><g><rect x="274.20000000000005" y="198" width="40" height="28" rx="7" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".10"/><text x="294" y="217" class="mono" font-size="12" fill="#e8edf4" fill-opacity=".85" text-anchor="middle">JWT</text></g></g></svg>