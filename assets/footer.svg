<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="t"><title id="t">Abierto a construir y automatizar. Camilo García, Junior Developer.</title><defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e8b04b"/><stop offset="1" stop-color="#5eead4"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0e16"/><stop offset="1" stop-color="#121a28"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity=".06"/></pattern>
</defs>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
.rise{animation:rise .7s ease backwards}
.cur{animation:blink 1.1s steps(1) infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
.glow{animation:glow 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="150" rx="18" fill="url(#bg)"/>
<rect width="1200" height="150" rx="18" fill="url(#dots)"/>
<rect x=".5" y=".5" width="1199" height="149" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
<rect x="0" y="147" width="1200" height="3" fill="url(#g)"/>
<text x="600.0" y="68" class="sans" font-size="26" font-weight="700" fill="#e8edf4" text-anchor="middle">Si un proceso se repite, se puede automatizar.</text>
<text x="600.0" y="104" class="mono" font-size="14" fill="#8b97a8" text-anchor="middle">Camilo García · Junior Developer · Bucaramanga, Colombia<tspan class="cur" fill="#5eead4"> _</tspan></text>
</svg>