<svg xmlns="http://www.w3.org/2000/svg" width="220" height="54" viewBox="0 0 220 54" role="img" aria-labelledby="t"><title id="t">Hoja de vida</title><style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
.rise{animation:rise .7s ease backwards}
.cur{animation:blink 1.1s steps(1) infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
.glow{animation:glow 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="218" height="52" rx="12" fill="#0a0e16" stroke="#e8b04b" stroke-opacity=".6"/>
<rect x="1" y="1" width="6" height="52" rx="3" fill="#e8b04b"/>
<text x="24" y="25" class="sans" font-size="15" font-weight="700" fill="#e8edf4">Hoja de vida</text>
<text x="24" y="42" class="mono" font-size="11" fill="#8b97a8">PDF · formato ATS</text>
<text x="200" y="33" class="mono" font-size="16" fill="#e8b04b" text-anchor="end">&#8594;</text>
</svg>