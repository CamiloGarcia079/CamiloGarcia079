<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Camilo Andrés García Almeida, Junior Developer</title><desc id="d">Técnico en Desarrollo de Software e Inteligencia Artificial. Automatizaciones, bots y desarrollo web. Próxima etapa productiva en Globant, diciembre de 2026.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0e16"/><stop offset="1" stop-color="#121a28"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e8b04b"/><stop offset="1" stop-color="#5eead4"/></linearGradient>
<radialGradient id="halo" cx=".78" cy=".45" r=".5"><stop offset="0" stop-color="#5eead4" stop-opacity=".12"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></radialGradient>
<radialGradient id="halo2" cx=".05" cy="1" r=".6"><stop offset="0" stop-color="#e8b04b" stop-opacity=".10"/><stop offset="1" stop-color="#e8b04b" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity=".06"/></pattern>
<clipPath id="clip"><rect width="1200" height="420" rx="18"/></clipPath>
<clipPath id="type"><rect x="64" y="226" width="0" height="34"><animate attributeName="width" from="0" to="620" dur="2.2s" begin=".9s" fill="freeze" calcMode="spline" keySplines=".4 0 .2 1" keyTimes="0;1"/></rect></clipPath>
</defs>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
.rise{animation:rise .7s ease backwards}
.cur{animation:blink 1.1s steps(1) infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
.glow{animation:glow 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.flow{stroke-dasharray:6 8;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-28}}
</style>
<g clip-path="url(#clip)">
<rect width="1200" height="420" fill="url(#bg)"/>
<rect width="1200" height="420" fill="url(#dots)"/>
<rect width="1200" height="420" fill="url(#halo)"/>
<rect width="1200" height="420" fill="url(#halo2)"/>
<rect x="18" y="0" width="1164" height="3" fill="url(#gold)"/>
<rect x=".5" y=".5" width="1199" height="419" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

<!-- texto -->
