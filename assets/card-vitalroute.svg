<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-labelledby="t"><title id="t">VitalRoute: Triaje de emergencias y despacho a la clínica adecuada, con un centro de mando que se actualiza en vivo.</title><defs>
<linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#5eead4" stop-opacity=".1"/></linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="gl" cx="1" cy="0" r=".8"><stop offset="0" stop-color="#5eead4" stop-opacity=".16"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></radialGradient>
<clipPath id="c"><rect width="600" height="250" rx="14"/></clipPath>
</defs>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
.rise{animation:rise .7s ease backwards}
.cur{animation:blink 1.1s steps(1) infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
.glow{animation:glow 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.sh{animation:shimmer 3.5s ease-in-out infinite}
</style>
<g clip-path="url(#c)">
<rect width="600" height="250" fill="#0a0e16"/>
<rect width="600" height="250" fill="url(#gl)"/>
<rect width="600" height="3" fill="url(#a)"/>
<rect width="600" height="3" fill="url(#sh)" class="sh"/>
<rect x=".5" y=".5" width="599" height="249" rx="14" fill="none" stroke="#ffffff" stroke-opacity=".09"/>
<text x="26" y="40" class="mono" font-size="12" fill="#5eead4" letter-spacing="1">AGENTE IA · TIEMPO REAL</text>
<text x="574" y="40" class="mono" font-size="12" fill="#8b97a8" text-anchor="end">ver repositorio &#8594;</text>
<text x="26" y="78" class="sans" font-size="25" font-weight="700" fill="#e8edf4">VitalRoute</text>
<text x="26" y="106" class="sans" font-size="15" fill="#e8edf4" fill-opacity=".78">Triaje de emergencias y despacho a la clínica adecuada, con un</text><text x="26" y="128" class="sans" font-size="15" fill="#e8edf4" fill-opacity=".78">centro de mando que se actualiza en vivo.</text><text x="26" y="152" class="sans" font-size="13" fill="#8b97a8" font-style="italic">En pareja. Mi parte: API gateway, WebSockets, panel y agente.</text><text x="26" y="178" class="mono" font-size="12.5" fill="#5eead4">agente con tools · Socket.IO · mapa en vivo</text><g><rect x="26" y="198" width="92" height="28" rx="7" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".10"/><text x="72" y="217" class="mono" font-size="12" fill="#e8edf4" fill-opacity=".85" text-anchor="middle">TypeScript</text></g><g><rect x="126.0" y="198" width="70" height="28" rx="7" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".10"/><text x="161" y="217" class="mono" font-size="12" fill="#e8edf4" fill-opacity=".85" text-anchor="middle">Node.js</text></g><g><rect x="203.8" y="198" width="55" height="28" rx="7" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".10"/><text x="231" y="217" class="mono" font-size="12" fill="#e8edf4" fill-opacity=".85" text-anchor="middle">React</text></g><g><rect x="266.8" y="198" width="55" height="28" rx="7" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".10"/><text x="294" y="217" class="mono" font-size="12" fill="#e8edf4" fill-opacity=".85" text-anchor="middle">MySQL</text></g></g></svg>